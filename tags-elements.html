<!DOCTYPE html>
<html>
<head>
    <title>HTML Tags and Elements</title>
</head>
<body>

    <!-- Basic HTML tag syntax -->
    <p>This is a paragraph.</p>

    <!-- An HTML element usually has an opening tag, content, and a closing tag -->
    <h1>Hello World</h1>

    <!-- Some elements do not need a closing tag (void elements) -->
    <br>
    <hr>

</body>
</html>
